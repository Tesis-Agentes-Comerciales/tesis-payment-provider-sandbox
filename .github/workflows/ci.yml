name: Validate payment provider

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: psp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_BUILD_CONSTRAINT: .github/build-constraints.txt
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
  PYTEST_ADDOPTS: ""
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        id: uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.15"
          enable-cache: true
      - name: Install Python and locked dependencies
        id: dependencies
        run: |
          uv python install
          uv sync --frozen --all-groups
      - name: Ruff format
        id: format
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: uv run ruff format --check .
      - name: Ruff lint
        id: lint
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: uv run ruff check .
      - name: Pyright
        id: types
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: uv run pyright
      - name: Build distributions with pinned build requirements
        id: build
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: uv build --require-hashes
      - name: Verify and record mandatory outcomes
        if: ${{ always() }}
        env:
          CI_STEPS_JSON: ${{ toJSON(steps) }}
          CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci_evidence.py quality
      - name: Upload quality evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: psp-quality-evidence
          path: .local/ci/quality/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        id: uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.15"
          enable-cache: true
      - name: Install Python and locked dependencies
        id: dependencies
        run: |
          uv python install
          uv sync --frozen --all-groups
      - name: Full existing suite and CI guard regressions
        id: pytest
        run: >-
          uv run python -m pytest -p scripts.ci_pytest
          --junitxml=.local/ci/tests/junit.xml
          --ci-outcomes=.local/ci/tests/outcomes.json
          --tb=no --show-capture=no
      - name: Verify and record mandatory outcomes
        if: ${{ always() }}
        env:
          CI_STEPS_JSON: ${{ toJSON(steps) }}
          CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci_evidence.py tests
      - name: Upload individual test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: psp-test-evidence
          path: .local/ci/tests/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
