[project]
name = "tesis-payment-provider-sandbox"
version = "0.1.0"
description = "Independent synthetic payment provider for ACP experiments"
requires-python = ">=3.12,<3.13"
dependencies = [
  "ap2 @ git+https://github.com/google-agentic-commerce/AP2.git@e1ea56db72a6385bce3e5c1112b3a56ce60acb43",
  "fastapi>=0.116,<1",
  "jwcrypto>=1.5.6,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pyjwt[crypto]>=2.10,<3",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
  "cryptography>=46.0.5,<47",
  "httpx>=0.28,<1",
  "pytest>=8.4,<10",
  "pyright>=1.1.405,<2",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/tesis_payment_provider"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
